name: Bridge N35 bounded macOS regression

# This isolated candidate permits exactly one explicitly dispatched job.
# Restore the normal regression workflow when integrating the runtime change.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-n35-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Check orchestration and record toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/test_bridge_mux_n35_ci.py
          xcodebuild -version
          swift --version
      - name: Reproduce original failure, then test candidate once
        shell: bash
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: python3 Scripts/run-bridge-mux-n35-ci.py
      - name: Preserve test and timeout evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bridge-mux-n35-${{ github.sha }}
          path: ${{ runner.temp }}/bridge-mux-n35-evidence
          if-no-files-found: warn
          retention-days: 14
