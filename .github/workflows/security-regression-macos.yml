name: CellProtocol macOS regression

on:
  pull_request:
    paths: ['Sources/**', 'Tests/**', 'commons/**', 'Package.swift', 'Package.resolved', 'Scripts/verify-transport-security-floor.sh', '.github/workflows/security-regression-macos.yml']
  push:
    branches: [main]
    paths: ['Sources/**', 'Tests/**', 'commons/**', 'Package.swift', 'Package.resolved', 'Scripts/verify-transport-security-floor.sh', '.github/workflows/security-regression-macos.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    # Existing CellApple sources import FoundationModels and need the 26 SDK.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      # The interop fixtures are generated on Linux. This step reports, as
      # annotations, whether Darwin Foundation encodes them the same way,
      # independently of the rest of the suite.
      - name: Interop fixtures on Darwin
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          swift test --disable-automatic-resolution --jobs 4 --filter InteropFixturesV1Tests 2>&1 | tee interop-darwin.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            echo "::notice title=InteropFixturesV1 Darwin::passed"
          else
            grep -E "error:|failed|XCTAssert" interop-darwin.log | head -20 | while IFS= read -r line; do
              echo "::error title=InteropFixturesV1 Darwin::${line//::/ }"
            done
          fi
          rm -f interop-darwin.log
          exit "$status"
      - name: Test exact sources and pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          swift test --disable-automatic-resolution --jobs 4
          git diff --exit-code -- Package.swift Package.resolved Sources Tests commons
      - name: Verify peer, Scanner, EntityScanner, record and mux lifetimes with Thread Sanitizer
        shell: bash
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: |
          set -euo pipefail
          # Each invocation starts a fresh test process. The first rebuilds the
          # pinned package with instrumentation; later invocations reuse it.
          for attempt in 1 2 3; do
            echo "Peer, Scanner, consumer, record and mux Thread Sanitizer pass ${attempt}/3"
            swift test --disable-automatic-resolution --jobs 2 \
              --sanitize thread --filter 'EphemeralIdentityVaultConcurrencyTests|PublisherAsyncLifetimeTests|BridgeDescriptionConcurrencyTests|EntityScannerConsumerSecurityTests|ScannerNearbyInteractionTests|ScannerPeerAuthenticationTests|ScannerServiceInvitationTests|ScannerAdmissionTests|ScannerRetainedStateTests|BridgePeerV3Tests|BridgePeerRecordLayerTests|BridgePeerFlowControlTests|BridgeMultiplexingTests|BridgeMuxSendLifetimeTests|BridgeResponseLifetimeTests|BridgeFeedAndRPCOrderingTests|BridgeFactoryLifetimeTests|BridgeSigningLifetimeTests|VaporWebSocketAdmissionTests|BridgeChannelWebSocketTests|CorrespondenceRelationshipTests|AppleBridgeTransportTests|AppleWebSocketAdmissionTests|WebSocketSendCompletionTests|WebSocketConnectionFailureTests|IntegrationTests/testConcurrentAbsorb'
          done
          git diff --exit-code -- Package.swift Package.resolved Sources Tests commons
      - name: Reject a vulnerable downstream transport pin
        shell: bash
        run: bash Scripts/verify-transport-security-floor.sh
