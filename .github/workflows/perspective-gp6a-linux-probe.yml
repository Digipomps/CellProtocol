name: Perspective GP6-A R3 Linux probe

# Read-only evidence for the frozen GP6-A-R3 source (MANIFEST-GP6A-R3.json
# 7cb5bca2…). Not the Mac attempt, not acceptance. Runs only on this branch.
on:
  push:
    branches:
      - probe/perspective-gp6a-r3-linux

permissions:
  contents: read

jobs:
  linux-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Toolchain
        run: swift --version
      - name: Build all targets and tests
        run: swift build --build-tests --force-resolved-versions -j 2 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Perspective and RelationalLearning tests
        run: swift test --skip-build --filter 'Perspective|RelationalLearning' 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Summary
        if: always()
        shell: bash
        run: |
          grep -E "error:" build.log | head -40 || true
          grep -E "Executed|failed \(" test.log | tail -40 || true
